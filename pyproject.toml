[project]
name = "planbook-cli"
version = "0.1.0"
description = "Agent-oriented CLI for Planbook.com (unofficial)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "browser-cookie3>=0.19"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25"]
browser = ["playwright>=1.40"]

[project.scripts]
planbook = "planbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planbook"]
