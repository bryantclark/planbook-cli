name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a release PR that bumps the version and CHANGELOG from the
      # commits since the last release. Merging that PR tags the release.
      # Uses the built-in GITHUB_TOKEN - no secrets, free on public repos.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
