[project]
name = "planbook-cli"
version = "0.2.0"
description = "Agent-oriented CLI for Planbook.com (unofficial)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "browser-cookie3>=0.19"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6", "mypy>=1.11",
       "types-requests"]
browser = ["playwright>=1.40"]

[project.scripts]
planbook = "planbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planbook"]


[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ARG", "C4", "PTH", "RET"]
ignore = ["E501"]          # line length is formatted, not linted

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]        # fixtures are arguments the test never names

[tool.mypy]
python_version = "3.10"
# macOS-targeted (browser default detection, Keychain), so type-check as
# darwin. Without this, mypy on a Linux CI runner narrows sys.platform and
# marks the whole darwin-only default_browser path unreachable.
platform = "darwin"
files = ["src/planbook"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr"]

[[tool.mypy.overrides]]
module = ["browser_cookie3.*", "playwright.*"]
ignore_missing_imports = true
