[project]
name = "planbook-cli"
version = "0.1.0"
description = "Agent-oriented CLI for Planbook.com (unofficial)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
planbook = "planbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planbook"]
